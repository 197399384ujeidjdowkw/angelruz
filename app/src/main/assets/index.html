<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#7048B8"><title>Sistema Halcón</title><link rel="stylesheet" href="style-v304.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f2f4f7;color:#20232a}button,input,textarea{font:inherit}.screen{min-height:100vh;padding:18px;display:flex;align-items:center;justify-content:center}.card{width:min(430px,100%);background:white;border-radius:20px;padding:22px;box-shadow:0 8px 30px #0001}.logo{font-weight:800;font-size:25px;color:#7048B8;text-align:center;margin-bottom:6px}.sub{text-align:center;font-size:12px;color:#777;margin-bottom:22px}.field{display:block;margin:10px 0}.field span{font-size:11px;font-weight:700}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;margin-top:5px}.pass{display:flex;gap:6px}.pass input{flex:1}.pass button{width:48px;border:0;border-radius:11px;background:#eee}.primary{width:100%;border:0;border-radius:11px;padding:12px;background:#7048B8;color:white;font-weight:700;margin-top:10px}.link{border:0;background:none;color:#7048B8;font-size:11px;margin-top:10px}.hidden{display:none}.top{height:58px;background:#7048B8;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.top button{background:#ffffff22;color:white;border:0;border-radius:10px;padding:8px}.content{padding:12px 12px 80px}.title{font-size:15px;font-weight:800}.bottom{position:fixed;left:8px;right:8px;bottom:8px;background:white;border-radius:16px;box-shadow:0 5px 25px #0002;display:flex;padding:6px;gap:5px}.nav{flex:1;border:0;background:transparent;padding:7px 2px;font-size:10px}.nav b{display:block;font-size:19px}.section{background:white;border-radius:14px;margin:9px 0;padding:12px}.row{display:flex;gap:7px}.row>*{flex:1}.msg{padding:9px;border-bottom:1px solid #eee;font-size:12px}.item{border-left:4px solid #7048B8;background:white;border-radius:12px;margin:8px 0}.itemhead{padding:9px;display:flex;justify-content:space-between;font-size:12px;font-weight:700}.itembody{padding:10px;border-top:1px solid #eee}.small{font-size:11px;color:#777;line-height:1.45}
.brandline{height:1px;background:#ececf1;margin:28px 0 14px}
.foot{line-height:1.5;margin:0!important;padding-top:0}
.helpArea{margin-top:18px;text-align:center}
.helpBtn{border:0;background:transparent;color:#7048B8;font-size:12px;text-decoration:underline;padding:8px}
.helpBox{display:none;margin-top:14px;padding:14px;border:1px solid #e3e3ea;border-radius:12px;background:#faf9fc}
.helpBox.on{display:block}
.helpBox p{font-size:11px;color:#666;line-height:1.45;text-align:left}
.waRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.waBtn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:10px;background:#eef8f0;color:#226638;font-size:11px;font-weight:700}
.backCentered{display:block;margin:14px auto 0;border:0;background:transparent;color:#7048B8;font-size:12px}
.eyeBtn{font-size:0!important;position:relative}
.eyeBtn:before{content:'👁';font-size:18px}
.compact{padding:10px}
.saveFloat{position:fixed;right:16px;bottom:78px;border:0;border-radius:999px;padding:12px 18px;background:#7048B8;color:white;font-weight:700;box-shadow:0 6px 18px #0002}
.detail{width:100%;min-height:90px;resize:vertical;margin-top:7px;padding:10px;border:1px solid #ddd;border-radius:9px}
.itemactions{display:flex;gap:7px;margin-top:8px}
.itemactions button{flex:1;border:0;border-radius:9px;padding:8px}
.swipeHint{font-size:10px;color:#777;padding:4px 2px}
.moduleSwitch{display:flex;align-items:center;gap:5px}</style></head><body><div id="app"></div><script src="state.js"></script><script src="auth-v304.js"></script><script src="home-v304.js"></script><script src="callbacks-v304.js"></script></body></html>
