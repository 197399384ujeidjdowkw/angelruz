name: Build Sistema Halcon APK
on:
  workflow_dispatch:
  push:
    branches: [ main, halcon-android-notificaciones-20261013 ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: gradle assembleDebug
      - run: gradle assembleRelease
      - name: Align release APK
        if: github.ref_name == 'halcon-android-notificaciones-20261013'
        run: |
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          "$ZIPALIGN" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/Sistema-Halcon-v3.3.7-aligned-unsigned.apk
      - name: Sign and verify release APK
        if: github.ref_name == 'halcon-android-notificaciones-20261013'
        env:
          HALCON_RELEASE_KEYSTORE_B64: ${{ secrets.HALCON_RELEASE_KEYSTORE_B64 }}
          HALCON_RELEASE_STORE_PASSWORD: ${{ secrets.HALCON_RELEASE_STORE_PASSWORD }}
          HALCON_RELEASE_KEY_ALIAS: ${{ secrets.HALCON_RELEASE_KEY_ALIAS }}
          HALCON_RELEASE_KEY_PASSWORD: ${{ secrets.HALCON_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HALCON_RELEASE_KEYSTORE_B64" || { echo "Missing release signing credentials"; exit 1; }
          KEYSTORE="$(mktemp)"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$HALCON_RELEASE_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-type PKCS12 --ks-pass env:HALCON_RELEASE_STORE_PASSWORD --ks-key-alias "$HALCON_RELEASE_KEY_ALIAS" --key-pass env:HALCON_RELEASE_KEY_PASSWORD --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/release/Sistema-Halcon-v3.3.7-INSTALABLE.apk app/build/outputs/apk/release/Sistema-Halcon-v3.3.7-aligned-unsigned.apk
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/Sistema-Halcon-v3.3.7-INSTALABLE.apk
      - name: Prepare independent APK signature verifier
        if: always()
        run: |
          mkdir -p verification-tools
          APKSIGNER_JAR="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -1)"
          test -f "$APKSIGNER_JAR" && cp "$APKSIGNER_JAR" verification-tools/apksigner.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sistema-halcon-apk-builds
          path: |
            verification-tools/apksigner.jar
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/Sistema-Halcon-v3.3.7-aligned-unsigned.apk
            app/build/outputs/apk/release/Sistema-Halcon-v3.3.7-INSTALABLE.apk
